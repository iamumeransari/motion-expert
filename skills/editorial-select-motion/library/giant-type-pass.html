<style>
  /* giant-type-pass (block). A giant serif line rushes past the camera: the
     first word rises in from below the frame on an exponential ease-out
     while the accelerating camera pan carries the whole line leftwards, the
     next words rise in behind it one by one, and as a field (the ground slot)
     blooms in behind the type the letters turn from black to white along a
     soft edge that sweeps left to right on a 20 degree axis, so the line
     leaves the frame white over the picture.

     Source: replica s2 frames 216 to 218 and s3 frames 219 to 243 (strip
     assets/frames/giant-word-pass-dense.jpg), on the film's 16 fps picture
     cadence. Measured at 1920 x 1080: font-size 669.5 px in the traced line
     face (ES Line), baseline settling at 779.8 px; the first word's rise is
     728 px decaying about 0.79 per picture (k 0.157 per frame) and lands
     24 frames after entry; the second word enters 18 frames later from
     370 px decaying 0.667 per picture (k 0.27); the pan is the icon-tile
     pan, dx -1.088 W on (e^(4.032 u) - 1) / (e^4.032 - 1) over 31.5 frames
     starting 3.5 frames before the type enters; the white edge runs from
     frame 12 to about 22, its whiteness measured per frame from the film
     and projected on a -20 degree axis (mean error 0.013 inside the glyphs).

     preset "replica-s3-rush" replays those per-frame keys for 28 frames
     from source frame 216 (glyph x positions, word offsets, white profiles,
     ground frames from frame 12). The general mode builds the same state
     from the fitted curves for any words, frame and duration scale. */
  .el-giant-type-pass { position: absolute; left: 0; top: 0; pointer-events: none; overflow: hidden; }
  .el-giant-type-pass svg { position: absolute; left: 0; top: 0; overflow: visible; }
  .el-giant-type-pass .gp-word { font-kerning: none; white-space: pre; }
  .el-giant-type-pass .gp-gimg { opacity: 0; }
  .el-giant-type-pass .gp-line { opacity: 0; }
</style>
