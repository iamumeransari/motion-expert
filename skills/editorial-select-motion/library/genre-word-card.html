    return {
      /* props (see genre-word-card.md):
           preset: "replica-s1-shot1".."replica-s1-shot7" | "replica-s1-cards", with image or images[] filling the slot
           cards: [{ word, image (slot), dur (s), enter (spread on the cut, 1 = none),
                     tracking (em), color, chipColors [tl, tr, bl, br], step: { at (s), scale } }]
             or words: [...] with images: [...]
           cap (px at 1080, 102), wordX, wordY (share of frame for the ink centre and the baseline;
             never x and y, which the runtime reads as the element's own position),
           pad ([x, y] in caps, [0.5, 0.58]), color (token, type-light), chipColor(s),
           imageBox ([x, y, w, h] shares; full bleed by default), handles (false to drop them),
           durScale, beats (cut times), exitAt, cadence ("16") */
      render: function (props) {
        var W = SH.fw(props), H = SH.fh(props), P = plan(props), bf = SH.baseFrac();
        var el = document.createElement("div");
        el.className = "el-genre-word-card";
        el.style.width = W + "px"; el.style.height = H + "px";
        P.cards.forEach(function (c, i) {
          var card = document.createElement("div");
          card.className = "gw-card"; card.setAttribute("data-card", i);
          if (c.t <= 0) card.style.opacity = "1";
          card.appendChild(buildSlot(c, W, H, props, i));
          var word = document.createElement("div"); word.className = "gw-word";
          if (c.step) word.style.transformOrigin = c.centre + "px " + (c.base - c.cap / 2) + "px";
          for (var g = 0; g < c.word.length; g++) {
            var n = document.createElement("div"); n.className = "gw-g"; n.textContent = c.word[g];
            n.style.fontSize = c.size + "px"; n.style.color = SH.color(c.color);
            n.style.left = c.x[g] + "px"; n.style.top = (c.base - bf * c.size) + "px";
            word.appendChild(n);
          }
          card.appendChild(word);
          el.appendChild(card);
        });
        if (P.handles) {
          var hl = document.createElement("div"); hl.className = "gw-handles";
          el.__gwHandles = P.preset ? presetHandles(props) : generalHandles(P, props);
          if (el.__gwHandles) SEL.build(hl, el.__gwHandles, props);
          el.appendChild(hl);
        }
        el.__gwPlan = P;
        return el;
      },
      animate: function (tl, el, t0, props) {
        var P = el.__gwPlan || plan(props), cads = props.cadence || "16", M = window.__motionExpert, snap = M.ease("snap");
        var cards = el.querySelectorAll(".gw-card");
        P.cards.forEach(function (c, i) {
          var card = cards[i];
          if (c.t > 0) SH.step(tl, card, { opacity: 0 }, { opacity: 1 }, t0 + c.t, false);
          if (i + 1 < P.cards.length || props.exitAt != null) SH.step(tl, card, { opacity: 1 }, { opacity: 0 }, t0 + c.tEnd, false);
          var gs = card.querySelectorAll(".gw-g");
          if (P.preset) {
            /* measured: each glyph steps when its position changes */
            for (var g = 0; g < gs.length; g++) {
              var prev = 0;
              for (var q = 0; q < c.keys.length; q++) {
                var off = c.keys[q][1][g] - c.x[g];
                if (Math.abs(off - prev) < 0.01) continue;
                if (c.keys[q][0] <= c.f0) { tl.fromTo(gs[g], { x: off }, { x: off, duration: 0.0001, ease: "none" }, t0); }
                else SH.step(tl, gs[g], { x: prev }, { x: off }, t0 + (c.keys[q][0] - 0.5) * FR, false);
                prev = off;
              }
            }
          } else if (c.enter !== 1) {
            /* the tracking snap: glyph centres spread about the word centre
               by the entry ratio and close to 1 over six frames, stepped */
            var mid = (c.inkL + c.inkR) / 2, d = 6 * FR * (P.ds || 1), pics = SH.pictures(t0 + c.t, t0 + c.t + d, cads);
            for (var g2 = 0; g2 < gs.length; g2++) {
              var cg = c.x[g2] + c.adv[g2] / 2 - mid, last = cg * (c.enter - 1);
              tl.fromTo(gs[g2], { x: last }, { x: last, duration: 0.0001, ease: "none", immediateRender: false }, t0 + c.t);
              for (var r = 1; r < pics.length; r++) {
                var e = snap(Math.min(1, (pics[r] - t0 - c.t) / d)), nx = cg * (c.enter - 1) * (1 - e);
                if (Math.abs(nx - last) < 0.01) continue;
                SH.step(tl, gs[g2], { x: last }, { x: nx }, pics[r], false); last = nx;
              }
            }
          }
          if (c.step && !P.preset) {
            var wd = card.querySelector(".gw-word");
            SH.step(tl, wd, { scale: 1 }, { scale: c.step.scale }, t0 + SH.quant(c.t + c.step.at * (P.ds || 1), cads), false);
          }
          /* photo sequence fills step their pictures */
          var spec = c.image || {};
          if (spec.seq && spec.seq.length) {
            var nodes = card.querySelectorAll(".es-slot[data-src]"), cur = spec.seq[0].src;
            for (var s2 = 1; s2 < spec.seq.length; s2++) {
              var nxt = spec.seq[s2].src; if (nxt === cur) continue;
              /* preset frames count from the block's start, general times from the cut */
              var tt = P.preset ? (spec.seq[s2].f - 0.5) * FR : c.t + (spec.seq[s2].t != null ? spec.seq[s2].t : spec.seq[s2].f * FR);
              for (var z = 0; z < nodes.length; z++) {
                var ns = nodes[z].getAttribute("data-src");
                if (ns === cur) SH.step(tl, nodes[z], { opacity: 1 }, { opacity: 0 }, t0 + tt, false);
                if (ns === nxt) SH.step(tl, nodes[z], { opacity: 0 }, { opacity: 1 }, t0 + tt, false);
              }
              cur = nxt;
            }
          }
          /* the plate camera (shot 5), per-frame matrices from the card's top left */
          if (P.cam && P.cam.length) {
            var camN = card.querySelector(".gw-cam"), pm = "matrix(1,0,0,1,0,0)";
            for (var cq = 0; cq < P.cam.length; cq++) {
              var K = P.cam[cq]; if (K[0] < c.f0 || K[0] > c.f1) continue;
              var m = "matrix(" + K[1] + "," + K[2] + "," + K[3] + "," + K[4] + "," + K[5] * P.s + "," + K[6] * P.s + ")";
              if (m === pm) continue;
              SH.step(tl, camN, { transform: pm }, { transform: m }, t0 + Math.max(0, (K[0] - 0.5) * FR), false); pm = m;
            }
          }
        });
        var hl = el.querySelector(".gw-handles");
        var end = t0 + P.end;
        if (hl && el.__gwHandles) end = Math.max(end, SEL.animate(tl, hl, t0, el.__gwHandles, props));
        return P.cards.length ? t0 + P.cards[0].t + 6 * FR : t0;
      }
    };

    /* The handles of a preset are the measured chip rectangles of its shot
       (the same data select-handles carries), so the block stands alone. */
    function presetHandles(props) {
      var all = PRESETS["replica-s1-cards"].chips, s = SH.fw(props) / 1920, a = 0, b = 78, out = {};
      var m = /^replica-s1-(shot\d)$/.exec(props.preset || "");
      if (m) { a = PRESETS.shots[m[1]][0]; b = PRESETS.shots[m[1]][1]; }
      for (var f = a; f <= b; f++) {
        var rs = all[String(f)]; if (!rs) continue;
        out[String(f - a)] = rs.map(function (r) { return [r[0] * s, r[1] * s, r[2] * s, r[3] * s, r[4], r[5]]; });
      }
      return { frames: out, f1: b - a + 1 };
    }
    function generalHandles(P, props) {
      var keys = [];
      P.cards.forEach(function (c, i) {
        keys.push({ t: c.t, box: c.box, mode: i === 0 ? "pop" : "glide", colors: c.chipColors || props.chipColors, color: props.chipColor, dur: 6 * FR * (P.ds || 1) });
        if (c.step) {
          var s = c.step.scale, mx = (c.box[0] + c.box[2]) / 2, my = c.base - c.cap / 2;
          keys.push({ t: SH.quant(c.t + c.step.at * (P.ds || 1), "16"), mode: "jump", colors: c.chipColors || props.chipColors, color: props.chipColor,
            box: [mx + (c.box[0] - mx) * s, my + (c.box[1] - my) * s, mx + (c.box[2] - mx) * s, my + (c.box[3] - my) * s] });
        }
      });
      return { keys: keys, chip: props.chip != null ? props.chip : 24 * SH.k(props), color: props.chipColor || "type-light", colors: props.chipColors,
               streak: props.streak, cadence: props.cadence, exitAt: props.exitAt };
    }
  })();
</script>
