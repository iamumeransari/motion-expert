     every second picture (mono, pixel, humanist, bitmap, grotesk) while the
     whole line steps up in size towards overflow. Source: frames 128 to 179 of
     the film (5.333 to 7.500 s), strips in ~/motion-expert/sources/editorial-select/frames and work/replica/s2.

     135, 136), incoming letters violet #9B7FD8 on 133 to 135 and black on 136;
     the hold is 29 frames with a scale swell of +0.37 percent peaking on frame
