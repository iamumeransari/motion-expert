<style>
  /* endcard-typeon. The end card: a sentence types on word by word inside
     violet pixel-bar handles that open out past the line with each word and
     then pull in to four corner chips; the line cuts out, the handles
     reappear as diagonal pixel-step brackets around a chip where the mark
     will be, the mark grows inside them while the brackets shrink back to
     corner chips, blink faint and go; the lockup (mark plus wordmark) cuts in
     already sliding left on an exponential ease, and the tagline drops in
     under it on one frame.
     Source: replica s8 (film frames 993 to 1135, 41.375 to 47.381 s; see
     references/sources.md). Measured at 1920 x 1080, everything on
     the film's 16 fps cadence (film frames 3k+2 repeat 3k+1):
     body line EditorialSelect Serif 105.8 px (cap 73 px) tracked -0.8 px,
     baseline 580, words on frames 0, 1, 4, 6, 7; handle rows 25 px tall at
     y 417 and 636 (baseline - 1.536 and + 0.534 of the size), centred on the
     frame, bars cycling four dashed patterns then a solid bar of 4 chips

     outer edge moves out on 1 - e^(-0.715 f); cut to brackets on frame 28

     mark 174 x 160.6 px, width 1 - e^(-0.45 (f - 28.25)) of full from frame
     30; lockup cut on 42 sliding 1 - e^(-0.25 (f - 39.5)) to mark x 377;
     tagline 66.7 px tracked 1.5 px on frame 70, baseline 731.5.

     the measurement (geometry only: the replica's words arrive as
     props.replica from outside the skill); the general mode
     rebuilds the same states from the fitted curves above, in units of the
     body size, for any sentence, mark, wordmark, frame and duration. */
