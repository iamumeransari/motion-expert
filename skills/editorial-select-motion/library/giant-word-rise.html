     the whole time while the photograph pulls back a touch, and then the

     stays full size over it and is cut on the next shot). Source: s5 shot 25,
     film frames 550 to 562 (moves.md).

     0.93; camera from the s5 replica's keys/s550r.json): baseline 1492, 1339,
     1191, 1106, 1050, 1010, 979 px on frames 552, 553, 555, 556, 558, 559, 561

     its cap height above the bottom edge), font size 982 px (cap 678, 0.628 of
     the frame height) and never scaling, left ink edge 257 px stepping 38 px
     left on every picture update (608 px a second); the photograph pushes 0.18
