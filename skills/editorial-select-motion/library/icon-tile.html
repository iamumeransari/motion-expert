<style>
  /* icon-tile (block). A flat violet tile carrying a mark slot, built in
     steps on paper: it arrives with the mark printed faintly into it and a
     slow push in, its corners notch out, the mark turns white and then black,
     the tile steps up to about twice its size and keeps pushing in, four
     handle chips arrive one corner at a time, glide outward, are pressed
     black one after another and pulled back in, then glide out again; the
     tile steps to lavender and the whole group is carried off by the
     accelerating camera pan of the giant pass.

     Source: replica s2 frames 180 to 218 and s3 frames 219 to 243 (strips
     ~/motion-expert/sources/editorial-select/frames/icon-tile-dense.jpg, lockup-icon-dense.jpg,
     giant-word-pass-dense.jpg). The film holds this move on its 16 fps
     picture cadence (source frames 3k+1 and 3k+2 show one picture).

     of the passing replica (side, centre, chips, mark scale, colours) for 64
     frames from source frame 180. The general mode builds the same per-frame
     state from fitted curves at any size, frame and duration scale:
       side 0.4245 S to 0.4635 S over 7 frames (snap), notches pale on 3 and
       paper on 4, mark faint to 4, white 4 to 7, black from 7; step to
       0.849 S on 10, then to S over 22 frames (snap); chips 0.0838 of the
       side, arriving 10 px (at S 384) out from the corners on 13, 16, 18,
       19, gliding out to 43 px from 18, 19.5, 20.5, 21 over 6 frames,
       pressed black on 27, 28, 28, 30 for 3 frames while pulled in to 12 px,
       gliding out to 45 px from 32, 33, 33, 34; lavender on 40; the pan
       starts on 32.5 and follows dx (e^(4.032 u) - 1) / (e^4.032 - 1) over
       31.5 frames, dx -1.088 W (fitted on the tile and the giant word
       together, rms 15 px).

     state; continuous curves are sampled per frame and then held on the
     cadence. Colours default to tokens.css. */
  .el-icon-tile { position: absolute; left: 0; top: 0; pointer-events: none; }
  .el-icon-tile .it-group { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; opacity: 0; }

            step(notches[i], nv, f);
          }
          step(looks.faint, { opacity: s.look === "faint" ? faintOp : 0 }, f);
          step(looks.white, { opacity: s.look === "white" ? 1 : 0 }, f);
          step(looks.black, { opacity: s.look === "black" ? 1 : 0, color: s.ink }, f);
          step(mark, { scaleX: s.msx, scaleY: s.msy }, f);
          for (var c = 0; c < 4; c++) {
            var q = s.chips[c];
            if (q) step(chips[c], { opacity: 1, x: r(s.cx + q[0] - 16), y: r(s.cy + q[1] - 16), scale: q[2] / 32, backgroundColor: q[3] }, f);
            else if (last.get(chips[c])) step(chips[c], { opacity: 0 }, f);
          }
        }
        var end = t0 + (st.length - 0.5) * FR;
        if (props.exitAt != null) {
          var tx = t0 + props.exitAt;
          tl.fromTo(g, { opacity: 1 }, { opacity: 0, duration: 0.0001, ease: "none", immediateRender: false }, tx);
          chips.forEach(function (ch) { if (last.get(ch)) tl.fromTo(ch, { opacity: last.get(ch).opacity }, { opacity: 0, duration: 0.0001, ease: "none", immediateRender: false }, tx); });
        }
        return P ? t0 + 32 * FR : end;
      }
    };
  })();
