     snap curve, their pictures swapping in place; words sit under the tiles on
     small paper cards that hide the grid and glide in the same steps; then
     the words collapse into one centred line, the line and the tiles grow,
     and the tiles clear a few per frame until only the line is left. The
     ground is optional, so the first tiles can land over the previous scene
     before the paper cuts in under them.
     Source strips: assets/frames/tile-scatter-dense.jpg (frames 79 to 139)
     and assets/frames/select-title-step-dense.jpg (frames 72 to 79).
     Measured at 1920 x 1080: paper #ECECEC with 1.5 px rules (#D2D2D2 on a
     #E1E1E1 half pixel) every 120 px across through x 960 and every 121.5 px
     down through y 540; tiles 240 x 245, 242 x 365, 483 x 318 and 363 x 242
     px, first two tiles landing on frames 75 and 76 over the previous scene
     and the paper cutting in on frame 79; tiles glide 15 to 50 px per step,
     each step two or three frames, settling by frame 100; words set at
     84.5 px (cap 58 px) on #F1F1F1 cards 120 px tall and 122 px wider than
     the ink; collapse on frame 112 into one line at 95 px, baseline y 566,
     centred, which then grows 1.156 by frame 126; tiles grow about 1.12
     about the frame centre over frames 113 to 127 on an accelerating curve
     while the grid only grows 1.018; tiles clear on frames 123, 124, 127
     and 129 and the grid goes with the last one. */

  .el-tile-scatter .ts-ground { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; transform-origin: 50% 50%; }
  .el-tile-scatter .ts-layer { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 50% 50%; }
  .el-tile-scatter .ts-tile { position: absolute; left: 0; top: 0; opacity: 0; overflow: hidden; transform-origin: 0 0; }
  .el-tile-scatter .ts-pic { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background-size: cover; background-position: center; opacity: 0; }
  .el-tile-scatter .ts-word { position: absolute; left: 0; top: 0; opacity: 0; white-space: nowrap; line-height: 1; color: #0A0A0A; }
  .el-tile-scatter .ts-card { position: absolute; background: #F1F1F1; }
  .el-tile-scatter .ts-text { position: absolute; left: 0; top: 0; }
  .el-tile-scatter .ts-line { position: absolute; left: 0; width: 100%; text-align: center; white-space: nowrap; line-height: 1; color: #0A0A0A; opacity: 0; transform-origin: 50% 50%; }
</style>
