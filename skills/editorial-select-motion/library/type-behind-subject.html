<style>
  /* type-behind-subject. A word sits in depth between a picture and its own
     subject: the plate at the back, the serif word in the middle, the cut-out
     subject in front, so the subject's silhouette cuts through the letters.
     The word lands in one frame with no tween (the film never fades it in), the
     subject can lift in front of an already visible word with a two-frame 15
     percent brightening, and an optional camera push scales the three layers
     about a focal point, the nearer layer a little more (parallax), on the
     push curve stepped on the sixteen-a-second picture.
     Source: s4 shot 17 frames 442 to 452 ("Mask it" behind the subject, cap
     height 205 px, ES Serif 297 px at pen 473.5, baseline 652, ink #F1F1F0,
     the marquee's fill fading behind the subject at 0.18, 0.18, 0.12) and the
     camera of s4 shots 20 and 21 (zoom 0.92 on cubic-bezier 0.213, 0.313,
     0.759, 0.883 over 8 frames; push 1.47 on push-hard). */
  .el-type-behind-subject { position: absolute; left: 0; top: 0; pointer-events: none; overflow: hidden; }
  .el-type-behind-subject .tb-cam { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .el-type-behind-subject .tb-layer { position: absolute; left: 0; top: 0; overflow: visible; display: block; }
  .el-type-behind-subject .tb-word { font-family: var(--font-serif); font-weight: 400; font-kerning: normal; white-space: pre; }
  .el-type-behind-subject .tb-hide { opacity: 0; }
  .el-type-behind-subject .tb-g { opacity: 0; }
