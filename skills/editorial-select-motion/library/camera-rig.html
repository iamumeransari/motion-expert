<style>
  /* camera-rig. The film's camera moves (push, punch, pull-back, steady pull,
     settle, drift, tilt) as presets on any image slot, a still or an image
     sequence, measured from the source and run on its cadences: the push on
     stills steps on the 16 fps picture cadence, the pulls on real footage run
     on ones. Source shots: film 822 to 843 (shots 34 and 35, the lying model,
     work/replica/s6 and s7 shot A) and film 847 to 992 (s7 shots B to I, the
     billboard pull-backs, from the tracked board planes); the rest of the
     preset table is cited in es-camera below. The root is a full-frame layer;
     the slot box is placed in frame px and the camera moves the picture inside
     it, so size, crop, focal point and motion are code and the picture is
     only the fill. */
  .el-camera-rig { position: absolute; left: 0; top: 0; pointer-events: none; overflow: hidden; }
  .el-camera-rig .cr-box { position: absolute; overflow: hidden; }
  .el-camera-rig .cr-cam { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .el-camera-rig .cr-pic { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background-repeat: no-repeat; }
  .el-camera-rig .cr-plate { position: absolute; left: 0; top: 0; display: block; max-width: none; }
  .el-camera-rig .cr-seq { opacity: 0; }
  .el-camera-rig .cr-seq.cr-first { opacity: 1; }
</style>
