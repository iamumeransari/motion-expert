     steps until it fills the frame. Inside the window the next picture is held
     zoomed (1.38 falling to 1) so its subject lines up with the current one.
     Source: s5 shots 25 to 26, film frames 556 to 565 (moves.md; the frame
     strips are listed in references/sources.md). Measured at 1920 x 1080:
     window 796, 103 to 1120, 974 on 556; 783, 100 to 1135, 975 on 558; 755,
     96 to 1168, 975 on 559; 722, 124 to 1219, 934 on 561; next card 462, 23
