<style>
  /* crop-select. A photograph is selected as a small tile on paper and its
     crop grows in steps, wider each time, taking a wider view of the same
     picture rather than stretching it, while violet handles streak out to the
     new corners and the word under the tile steps up in size and then opens
     its tracking. Then a hard cut to the picture full bleed, paper bars
     closing, a push, an exclamation set over the photograph and the pointer
     sliding in. Source: s6 shots 3 and 4, film frames 760 to 827, the
     select-grow beat and the exclamation plate (references/sources.md).
     Measured at 1920 x 1080: tile 524 x 632 settling to 573 x 694 over 8
     frames, first widen to 1134 over 17 frames and second to 1724 x 599
     (98 px margins) over 15, both on a slow creep then a two-picture jump
     (fitted beziers 0.802 0.013 0 1.063 and 0.909 -0.045 0 0.991); photo
     zoom 1.162, 1.176, 1.216 then 1.0 of its final cover scale; chips 24 px,
     their inner corner 7 px off the crop corner, arriving as diagonal
     streaks; word cap 102 px stepping to 153 px with the first widen, then
     tracking opening to 0.19 em with the second; cut at frame 57, bars of
     0.044 H closing over 5 frames, exclamation cap 254 px, pointer 9 frames

     Everything steps on the film's 16 fps cadence. */
  .el-crop-select { position: absolute; left: 0; top: 0; overflow: hidden; pointer-events: none; }
  .el-crop-select .cs-ground { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: var(--color-paper); }
  .el-crop-select .cs-ground img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }

     antialiased subpixel edges, so a crop edge creeps the way the film's does */

  .el-crop-select .cs-cam { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .el-crop-select .cs-pic { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .el-crop-select .cs-art { position: absolute; opacity: 0; display: block; max-width: none; }
  .el-crop-select .cs-layer { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .el-crop-select .cs-layer span { position: absolute; left: 0; top: 0; line-height: 1; white-space: pre; transform-origin: 0 0; font-kerning: none; opacity: 0; }
  .el-crop-select .cs-handles { position: absolute; left: 0; top: 0; overflow: visible; }
